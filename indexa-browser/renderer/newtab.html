<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Новая вкладка</title><script src="config.js"></script>
<style>
:root{--bg:#0b0f17;--p:#121826;--p2:#18202f;--ln:#222c3d;--tx:#e5e9f0;--mu:#8793a8;--ac:#6ea8ff;--ac2:#a78bfa}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;background:radial-gradient(600px 400px at 20% 10%,#6ea8ff1f,transparent),radial-gradient(500px 400px at 85% 90%,#a78bfa1c,transparent);animation:dr 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes dr{to{transform:translate(-30px,20px) scale(1.08)}}
main{position:relative;max-width:820px;margin:0 auto;padding:0 20px 60px;transition:padding .5s cubic-bezier(.2,.8,.2,1)}
body.home main{padding-top:17vh}body.res main{padding-top:22px}
.logo{display:block;font:700 54px/1 Georgia,serif;letter-spacing:-.03em;color:var(--tx);margin-bottom:26px;user-select:none;pointer-events:none;cursor:default}
.logo i{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
body.res .logo{font-size:26px;display:inline-block;margin:0 18px 0 0;vertical-align:middle}
#f{display:flex;gap:10px;align-items:center;animation:up .6s .08s cubic-bezier(.2,.8,.2,1) both}body.res #f{display:inline-flex;width:calc(100% - 100px);vertical-align:middle}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#q{flex:1;height:50px;border-radius:25px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font:inherit;font-size:16px;padding:0 22px;outline:0;transition:.2s}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 4px #6ea8ff26}body.res #q{height:42px}
#f button{height:50px;padding:0 24px;border-radius:25px;border:0;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#0b0f17;font:600 15px system-ui;cursor:pointer;transition:transform .15s,filter .15s}
#f button:hover{filter:brightness(1.1)}#f button:active{transform:scale(.95)}body.res #f button{height:42px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:44px}
.tile{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--p);text-decoration:none;color:var(--tx);animation:up .5s both;transition:transform .18s,border-color .18s,background .18s}
.tile:hover{transform:translateY(-3px);border-color:var(--ac);background:var(--p2)}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#0b0f17;flex:none}
.tile b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile small{color:var(--mu);font-size:12px}
.tl{margin:44px 0 -30px;color:var(--mu);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
#fl{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
#fl select,#fl input{height:34px;border-radius:17px;border:1px solid var(--ln);background:var(--p);color:var(--tx);padding:0 14px;font:inherit;font-size:13px;outline:0}#fl select:focus,#fl input:focus{border-color:var(--ac)}
#meta{color:var(--mu);font-size:13px;margin:10px 2px}
.hit{padding:16px 0;border-bottom:1px solid var(--ln);animation:up .45s both}
.hit a.t{font:600 19px Georgia,serif;color:var(--ac);text-decoration:none}.hit a.t:hover{text-decoration:underline}
.hit .u{font-size:12px;color:#34d399;margin:2px 0;word-break:break-all}.hit p{margin:4px 0 0;color:#b7c0d0}
mark{background:#fbbf2433;color:#fde68a;border-radius:3px;padding:0 2px}
#more{margin:22px auto 0;display:block;height:40px;padding:0 26px;border-radius:20px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}#more:hover{border-color:var(--ac)}
.sk{height:64px;border-radius:10px;margin:14px 0;background:linear-gradient(90deg,var(--p),var(--p2),var(--p));background-size:200%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200%}}
.logo span,.logo i{display:inline-block;animation:drop .8s calc(var(--i)*70ms) cubic-bezier(.2,.9,.3,1.35) both}
.logo i{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% 100%;-webkit-background-clip:text;color:transparent;animation:drop .8s calc(var(--i)*70ms) cubic-bezier(.2,.9,.3,1.35) both,gs 3.5s linear infinite}
body.home .logo{animation:fl 6s ease-in-out infinite}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(-8deg) scale(.8)}}@keyframes gs{to{background-position:200% 0}}@keyframes fl{50%{transform:translateY(-6px)}}
.tipd{margin-top:22px;color:var(--mu);font-size:14px;min-height:22px;animation:up .6s .3s both}
</style></head><body class="home"><div id="bg"></div>
<main><div class="logo" aria-label="Indexa"><span style="--i:0">i</span><span style="--i:1">n</span><span style="--i:2">d</span><span style="--i:3">e</span><span style="--i:4">x</span><i style="--i:5">a</i></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Поиск в Indexa или адрес сайта"><button>Найти</button></form>
<section id="home"><div class="tipd" id="tipd"></div><div class="tl">Проиндексированные сайты</div><div id="tiles"></div></section>
<section id="rs" hidden><div id="fl"><select id="lang"><option value="">Любой язык</option><option>ru</option><option>en</option><option>uz</option><option>uk</option><option>de</option><option>fr</option><option>es</option></select><select id="sort"><option value="">По релевантности</option><option value="new">Сначала новые</option></select><input id="site" placeholder="Только сайт: example.com" size="24"></div><div id="meta"></div><div id="list"></div><button id="more" hidden>Показать ещё</button></section></main>
<script>
const {API,KEY}=CFG,P=new URLSearchParams(location.search),q=(P.get('q')||'').trim();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o)=>{const u=new URL(`${API}/api/${p}`);u.searchParams.set('key',KEY);for(const k in o)u.searchParams.set(k,o[k]);const r=await fetch(u);return r.json()};
const looksUrl=s=>/^[a-z]+:\/\//i.test(s)||/^[^\s\/]+\.[a-z]{2,}(:\d+)?([\/?#]\S*)?$/i.test(s);
function to(extra){const n=new URLSearchParams({q:$('#q').value.trim()});for(const k of['lang','sort','site']){const v=(extra&&k in extra)?extra[k]:$('#'+k).value.trim();if(v)n.set(k,v)}location.search='?'+n}
$('#q').value=q;document.title=q?q+' — Indexa':'Новая вкладка';
$('#f').onsubmit=e=>{e.preventDefault();const v=$('#q').value.trim();if(!v)return;looksUrl(v)?location.href=/^[a-z]+:\/\//i.test(v)?v:'https://'+v:to()};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
if(!q){
 const TIPS=['Ctrl+Shift+T возвращает закрытую вкладку.','Ctrl+L переходит в адресную строку.','Правый клик по вкладке: закрепить, дублировать, отключить звук.','Звёздочка в адресной строке сохраняет страницу в закладки.','F12 открывает инструменты разработчика в отдельном окне.','Ctrl+Shift+N открывает приватное окно.','Выделите текст на странице и выберите «Искать в Indexa» в меню правой кнопки.','Ctrl+F ищет по странице, Ctrl++ и Ctrl+− меняют масштаб.','Замок в адресной строке показывает данные сертификата сайта.'];
 $('#tipd').textContent='Совет: '+TIPS[Math.floor(Math.random()*TIPS.length)];
 $('#q').focus();
 api('sites',{limit:24}).then(j=>{$('#tiles').innerHTML=(j.sites||[]).map((s,i)=>`<a class="tile" style="animation-delay:${i*40}ms" href="https://${esc(s.host)}"><div class="av" style="background:hsl(${hue(s.host)} 80% 70%)">${esc(s.host[0].toUpperCase())}</div><div style="min-width:0"><b>${esc(s.host)}</b><small>${s.pages} стр.</small></div></a>`).join('')||'';if(!(j.sites||[]).length)$('.tl').remove()}).catch(()=>$('.tl').remove())
}else{
 document.body.className='res';$('#home').hidden=true;$('#rs').hidden=false;
 for(const k of['lang','sort','site'])$('#'+k).value=P.get(k)||'';
 $('#lang').onchange=$('#sort').onchange=()=>to();$('#site').onkeydown=e=>{if(e.key==='Enter')to()};
 let off=0;
 const load=async()=>{
  const o={q,limit:10,offset:off};for(const[k,pk]of[['lang','lang'],['sort','sort'],['site','domain']]){const v=P.get(k);if(v)o[pk]=v}
  if(!off)$('#list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  let j;try{j=await api('search',o)}catch{j={error:'нет связи с API'}}
  if(!off)$('#list').innerHTML='';
  if(j.error){$('#meta').textContent=j.error==='rate_limited'?'Лимит запросов исчерпан':j.error;return}
  $('#meta').textContent=j.total?`Найдено ${j.total} · ${j.took} мс`:'Ничего не найдено. Попробуйте другие слова или фильтры.';
  $('#list').insertAdjacentHTML('beforeend',j.results.map((x,i)=>`<div class="hit" style="animation-delay:${i*50}ms"><a class="t" href="${esc(x.url)}">${esc(x.title)}</a><div class="u">${esc(x.url)}</div><p>${x.snippet}</p></div>`).join(''));
  off+=j.results.length;$('#more').hidden=off>=j.total
 };
 $('#more').onclick=load;load()
}
</script></body></html>
